name: nightly
on:
  push:
    branches:
      - "**"

jobs:
  binary:
    runs-on: ${{ matrix.os }}
    strategy:
      max-parallel: 3
      matrix:
        os: [ubuntu-22.04, windows-latest]

    steps:
      - name: 🐙 Checkout GitHub repo (Also build submodule AntaREST)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Update submodule to latest commit of `dev`
        run: |
          cd antares_web
          git checkout fix/desktop-issue
          git pull
          echo "Current commit: $(git log -1 --pretty=oneline)"
          cd ..

      - name: 🔗 Install wget for Windows
        if: matrix.os == 'windows-latest'
        run: choco install wget --no-progress


      - name: 💚 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2

      - name: 💚 Install dependencies
        run: npm install
        working-directory: antares_web/webapp

      - name: 💚 Build webapp
        run: bash ./build-front.sh
        working-directory: scripts
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: 🐍 Install development dependencies
        run: |
          python -m pip install uv
          cd antares_web/
          uv sync --all-extras
          cd ..

      - name: 📦 Packaging
        run: bash ./package_antares_web.sh
        working-directory: scripts

      - name: 📜️ Copy changelog file
        run: |
          cp antares_web/docs/CHANGELOG.md dist/package/CHANGELOG.md

      - name: 📦 Archive Antares Desktop for Windows
        if: matrix.os == 'windows-latest'
        run: 7z a AntaresWeb-${{ matrix.os }}-${{ github.ref_name }}.zip *
        working-directory: dist/package

      - name: 📦 Archive Antares Desktop for Ubuntu
        # this is the only way to preserve file permission and symlinks
        if: matrix.os != 'windows-latest'
        run: zip -r --symlinks AntaresWeb.zip *
        working-directory: dist/package
