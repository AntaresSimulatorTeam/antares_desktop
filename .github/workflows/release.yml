name: release
on:
  release:
    types: [published]
  push:
    branches:
      - "**"

jobs:
  binary:
    runs-on: ${{ matrix.os }}
    strategy:
      max-parallel: 3
      matrix:
        os: [ubuntu-22.04, windows-latest]

    steps:
      - name: 🐙 Checkout GitHub repo (Also build submodule AntaREST)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: 🐍 Install development dependencies
        run: |
          python -m pip install uv
          cd antares_web/
          uv sync --all-extras
          cd ..

      - name: 📦 Packaging
        run: bash ./package_antares_web.sh
        working-directory: scripts

      - name: 📜️ Copy changelog file
        run: |
          cp antares_web/docs/CHANGELOG.md dist/package/CHANGELOG.md

      - name: 📦 Archive Antares Desktop for Windows
        if: matrix.os == 'windows-latest'
        run: 7z a AntaresWeb-${{ matrix.os }}-${{ github.ref_name }}.zip *
        working-directory: dist/package

      - name: 📦 Archive Antares Desktop for Ubuntu
        # this is the only way to preserve file permission and symlinks
        if: matrix.os != 'windows-latest'
        run: zip -r --symlinks AntaresWeb-${{ matrix.os }}-${{ github.ref_name }}.zip *
        working-directory: dist/package
